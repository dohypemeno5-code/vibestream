# ============================================================
# MELHORA APP LIVE - NGINX CONFIG
# Com proteção Anti-DDoS, Firewall WAF e Proxy Reverso
# ============================================================

# Limites globais
worker_rlimit_nofile 65535;
events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    # ============================================================
    # CONFIGURAÇÕES BÁSICAS
    # ============================================================
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    sendfile       on;
    tcp_nopush     on;
    tcp_nodelay    on;
    
    keepalive_timeout  65;
    keepalive_requests 100;
    
    client_body_timeout   10s;
    client_header_timeout 10s;
    send_timeout          10s;
    
    # Tamanhos máximos
    client_body_buffer_size   128K;
    client_header_buffer_size 1k;
    client_max_body_size      50M;
    large_client_header_buffers 4 8k;
    
    # Buffer pool
    output_buffers   32 32k;
    postpone_output  1460;
    
    # Compressão
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ============================================================
    # ANTI-DDOS / RATE LIMITING
    # ============================================================
    
    # Zonas de rate limit
    limit_req_zone  $binary_remote_addr  zone=login:10m    rate=5r/m;
    limit_req_zone  $binary_remote_addr  zone=api:10m      rate=30r/s;
    limit_req_zone  $binary_remote_addr  zone=static:10m   rate=100r/s;
    limit_req_zone  $binary_remote_addr  zone=websocket:10m rate=10r/s;
    
    # Conexões por IP
    limit_conn_zone $binary_remote_addr zone=addr:10m;
    
    # ============================================================
    # WAF - WEB APPLICATION FIREWALL
    # ============================================================
    
    # Bloquear User-Agents maliciosos
    map $http_user_agent $bad_bot {
        default 0;
        ~*(curl|wget|python|perl|ruby|nikto|scanner|masscan|sqlmap|nmap) 1;
        ~*(hydra|medusa|hashcat|john|openvas|nessus) 1;
        ~*(ZmEu|Morfeus|Fuck|sex|hacker|virus|malware) 1;
        ~*(acunetix|havij|netsparker|appscan|wpscan) 1;
    }
    
    # Bloquear query strings maliciosas
    map $query_string $bad_query {
        default 0;
        ~*(union.*select|select.*from|insert.*into|drop.*table) 1;
        ~*(<script|javascript:|onerror=|onload=|<iframe|<embed) 1;
        ~*(/etc/passwd|/bin/sh|/proc/self|/usr/bin) 1;
        ~*(cmd=|exec=|eval=|system\(|passthru) 1;
        ~*(%00|%0d%0a|../|..\\|..%252f) 1;
    }
    
    # Bloquear métodos HTTP perigosos
    map $request_method $bad_method {
        default 0;
        TRACE 1;
        TRACK 1;
        CONNECT 1;
    }

    # ============================================================
    # UPSTREAM - Node.js Server
    # ============================================================
    upstream melhora_backend {
        server 127.0.0.1:3000;
        keepalive 64;
    }

    # ============================================================
    # SERVER - HTTPS (recomendado)
    # ============================================================
    server {
        listen 80;
        listen [::]:80;
        server_name melhora.app www.melhora.app;
        
        # Redirecionar para HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
        
        # ACME challenge para SSL
        location /.well-known/acme-challenge/ {
            root /var/www/html;
        }
    }

    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name melhora.app www.melhora.app;
        
        # SSL (configure com Let's Encrypt)
        ssl_certificate     /etc/letsencrypt/live/melhora.app/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/melhora.app/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/melhora.app/chain.pem;
        
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;
        
        # HSTS
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        
        # Headers de segurança
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        
        # ============================================================
        # WAF - BLOQUEIO DE AMEAÇAS
        # ============================================================
        
        # Bloquear bots maliciosos
        if ($bad_bot) {
            return 403;
        }
        
        # Bloquear queries maliciosas
        if ($bad_query) {
            return 403;
        }
        
        # Bloquear métodos perigosos
        if ($bad_method) {
            return 405;
        }
        
        # ============================================================
        # LOCATIONS
        # ============================================================
        
        # Proteção de arquivos sensíveis
        location ~ /\.(?!well-known) {
            deny all;
            access_log off;
            log_not_found off;
            return 404;
        }
        
        location ~ (\.env|\.git|\.sql|\.db|config\.json|package\.json|node_modules) {
            deny all;
            access_log off;
            return 404;
        }
        
        # Admin panel - rota escondida (protegida pelo backend)
        # O backend valida o secret na sessão
        
        # API - com rate limiting
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            limit_conn addr 10;
            
            # CORS headers
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Admin-Secret" always;
            
            if ($request_method = OPTIONS) {
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }
            
            proxy_pass http://melhora_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            
            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
        }
        
        # WebSocket - lives em tempo real
        location /stream/ {
            limit_req zone=websocket burst=5 nodelay;
            limit_conn addr 5;
            
            proxy_pass http://melhora_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
        
        # Arquivos estáticos - cache longo
        location /static/ {
            limit_req zone=static burst=50 nodelay;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
        
        # Uploads
        location /uploads/ {
            limit_req zone=static burst=20 nodelay;
            expires 7d;
            add_header Cache-Control "public";
        }
        
        # Admin panel - rota secreta
        location ~ ^/admin- {
            # O backend faz a validação de sessão
            proxy_pass http://melhora_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # Frontend - fallback para SPA
        location / {
            limit_req zone=static burst=50 nodelay;
            
            try_files $uri $uri/ /index.html;
            
            expires -1;
            add_header Cache-Control "no-cache";
            
            proxy_pass http://melhora_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # ============================================================
        # LOGS
        # ============================================================
        access_log /var/log/nginx/melhora-access.log combined buffer=512k flush=1m;
        error_log  /var/log/nginx/melhora-error.log warn;
        
        # Log de ataques separado
        access_log /var/log/nginx/melhora-attack.log combined if=$bad_bot;
    }
}
