plugins {
    id 'com.android.application'
}

android {
    namespace 'com.strikearena.game'
    compileSdk 35

    defaultConfig {
        applicationId "com.strikearena.game"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
        multiDexEnabled false
    }

    signingConfigs {
        release {
            storeFile file('/tmp/melhora.keystore')
            storePassword 'melhora2024'
            keyAlias 'melhora'
            keyPassword 'melhora2024'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            debuggable false
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
